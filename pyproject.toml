[project]
name = "my-ai-test"
version = "0.1.0"
description = "基于 Inspect AI 的 AI 测试题库"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "inspect-ai",
    "anthropic",
    "openai",
    "playwright>=1.65.2",
]

# 注册本地 CLI 模型（claude-code/...、codex/...），Inspect 启动时会自动加载
[project.entry-points.inspect_ai]
local_models = "local_models._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_models"]
